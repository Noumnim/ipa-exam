<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2460"/>
      <stop offset="100%" style="stop-color:#1a56db"/>
    </linearGradient>
  </defs>
  <!-- Blue rounded square background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>
  <!-- Gold accent bar at top -->
  <rect x="10" y="8" width="44" height="5" rx="2.5" fill="#f59e0b"/>
  <!-- White "IPA" text -->
  <text x="32" y="46" font-family="Arial Black, Arial, sans-serif" font-size="24" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">IPA</text>
  <!-- Small subtitle line -->
  <text x="32" y="57" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1.5">EXAM</text>
</svg>
